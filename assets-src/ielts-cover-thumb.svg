<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="1248" height="936">
  <!-- Index thumbnail for IELTS Coach, recomposed at 4:3 from the repository's
       docs/readme/hero.svg so the hover box shows a whole picture. The earlier
       thumbnail was a crop of the rounded-corner cover, which left transparent
       corners visible against the page. Render at 1248x936 and save as
       public/work/ielts-coach/cover-thumb.webp. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a237e"/>
      <stop offset="0.62" stop-color="#3949ab"/>
      <stop offset="1" stop-color="#8e3b46"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd54f"/>
      <stop offset="1" stop-color="#ffb300"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="2">
    <line x1="0" y1="110" x2="800" y2="110"/><line x1="0" y1="170" x2="800" y2="170"/>
    <line x1="0" y1="230" x2="800" y2="230"/><line x1="0" y1="290" x2="800" y2="290"/>
    <line x1="0" y1="350" x2="800" y2="350"/><line x1="0" y1="410" x2="800" y2="410"/>
    <line x1="0" y1="470" x2="800" y2="470"/><line x1="0" y1="530" x2="800" y2="530"/>
  </g>
  <g font-family="'Helvetica Neue','PingFang SC',system-ui,-apple-system,sans-serif">
    <text x="56" y="84" fill="#ffc107" font-size="17" font-weight="700" letter-spacing="3">AI AGENT SKILL · SPEAKING + WRITING</text>
    <text x="52" y="160" fill="#ffffff" font-size="78" font-weight="800" letter-spacing="-1.5">IELTS Coach</text>
    <text x="56" y="208" fill="#ffffff" fill-opacity="0.92" font-size="27">Interviews you first, then writes</text>
    <text x="56" y="244" fill="#ffffff" fill-opacity="0.92" font-size="27">model answers in <tspan font-weight="700" fill="#ffc107">your own voice</tspan>.</text>

    <g transform="translate(-250 210)">
      <g transform="rotate(6 930 220)"><rect x="742" y="70" width="400" height="290" rx="20" fill="#e0f2f1"/></g>
      <g transform="rotate(2 930 220)"><rect x="716" y="80" width="410" height="296" rx="20" fill="#fff8e1"/></g>
      <g transform="rotate(-3 900 230)">
        <rect x="690" y="88" width="420" height="300" rx="20" fill="#ffffff"/>
        <rect x="690" y="88" width="10" height="300" rx="5" fill="#e91e63"/>
        <text x="726" y="130" fill="#e91e63" font-size="18" font-weight="800" letter-spacing="2">PART 2 · CUE CARD</text>
        <text x="726" y="170" fill="#1a237e" font-size="27" font-weight="800">Describe a noisy place</text>
        <text x="726" y="203" fill="#1a237e" font-size="27" font-weight="800">you have been to</text>
        <text x="726" y="240" fill="#616161" font-size="19" font-weight="600">You should say:</text>
        <g fill="#212121" font-size="19">
          <text x="740" y="270">• Where it is</text>
          <text x="740" y="298">• When you went there</text>
          <text x="740" y="326">• What you did there</text>
          <text x="740" y="354">• And explain why it's noisy</text>
        </g>
      </g>
      <circle cx="1106" cy="92" r="52" fill="url(#gold)"/>
      <text x="1106" y="98" text-anchor="middle" fill="#1a237e" font-size="32" font-weight="800">7.0</text>
      <text x="1106" y="122" text-anchor="middle" fill="#1a237e" font-size="14" font-weight="700" letter-spacing="1">TARGET</text>
    </g>
  </g>
</svg>
